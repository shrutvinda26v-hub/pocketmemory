name: Deploy BONSAI to GitHub Pages

on:
  push:
    branches: [cursor/visible-seasonal-weather-6676, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Configure basePath for project Pages
        run: |
          node -e "
          const fs=require('fs');
          let s=fs.readFileSync('next.config.ts','utf8');
          if(!s.includes('basePath')){
            s=s.replace('const nextConfig: NextConfig = {',
              \"const nextConfig: NextConfig = {\\n  basePath: '/pocketmemory',\\n  assetPrefix: '/pocketmemory',\");
            fs.writeFileSync('next.config.ts', s);
          }
          "
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
