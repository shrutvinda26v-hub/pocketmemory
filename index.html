<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fantasy Storybook</title>
    <meta name="theme-color" content="#07060b" />
    <meta
      name="description"
      content="A premium cinematic interactive fantasy storybook. Click a page and enter a completely different world."
    />
    <link rel="icon" href="/textures/leather.png" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <h1 class="sr-only">Interactive fantasy storybook</h1>
    <p class="sr-only">
      Click the right page to turn forward, or the left page to turn back. Each
      page is a different world.
    </p>

    <div class="studio" data-world="dragon" id="studio">
      <div class="studio-wash" id="studioWash"></div>
      <div class="studio-light"></div>
      <div class="studio-floor"></div>
      <div class="studio-vignette"></div>
      <div class="studio-grain"></div>
      <canvas class="fx" id="fx" aria-hidden="true"></canvas>

      <div class="stage">
        <div class="book-rig" id="bookRig">
          <div class="book" id="bookShell">
            <div class="cover-lip cover-lip-left" aria-hidden="true"></div>
            <div class="folios">
              <div class="gutter-glow" aria-hidden="true"></div>
              <div id="flipbook" class="flipbook"></div>
              <div class="folio-stack folio-stack-right" aria-hidden="true"></div>
              <div class="folio-stack folio-stack-bottom" aria-hidden="true"></div>
              <div class="corner-hint" aria-hidden="true"></div>
            </div>
            <div class="cover-lip cover-lip-right" aria-hidden="true"></div>
            <div class="clasp" aria-hidden="true"></div>
          </div>
          <div class="book-shadow" aria-hidden="true"></div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
