<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pocket Memory — Adaptive Skin</title>
    <meta
      name="description"
      content="An interactive hero: click a textured material and watch the chameleon change colour from head to tail."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Outfit:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="boot" id="boot" aria-hidden="true">
      <p>POCKET MEMORY</p>
    </div>

    <main class="hero" id="hero">
      <div class="atmosphere" aria-hidden="true">
        <div class="godrays"></div>
        <div class="haze"></div>
        <canvas class="dust" id="dust"></canvas>
        <div class="grain"></div>
        <div class="vignette"></div>
      </div>

      <header class="hud">
        <p class="hud-mark">POCKET MEMORY</p>
        <p class="hud-meta" id="hud-meta">NATURAL SKIN</p>
      </header>

      <section class="stage" id="stage">
        <div class="specimen">
          <div class="specimen-inner" id="specimen">
            <canvas id="chameleon" aria-label="A veiled chameleon that changes colour from head to tail"></canvas>
            <div class="reflection" id="reflection" aria-hidden="true"></div>
          </div>
        </div>
        <div class="swatches" id="swatches"></div>
      </section>

      <div class="copy">
        <p class="kicker">Hero · Adaptive wardrobe</p>
        <h1>Touch a material.<br /><em>The skin follows.</em></h1>
        <p class="lede" id="lede">
          Click any textured object. Colour walks from crest to tail — the chameleon only.
        </p>
      </div>

      <p class="hint" id="hint">CLICK A MATERIAL</p>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
