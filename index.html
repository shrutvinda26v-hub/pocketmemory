<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SPECIMEN 001 — An Object in Motion</title>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta
      name="description"
      content="A scroll-driven 2D fashion editorial: a jeweled sheep, disassembled and rebuilt by your hand."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Outfit:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="boot" id="boot">
      <p>SPECIMEN 001</p>
    </div>

    <section class="experience" id="experience">
      <div class="pin" id="pin">
        <div class="atmosphere" aria-hidden="true"></div>
        <div class="grain" aria-hidden="true"></div>
        <div class="vignette" aria-hidden="true"></div>
        <div class="shockwave" id="shockwave" aria-hidden="true"></div>

        <p class="hud hud-left">SPECIMEN 001</p>
        <p class="hud hud-right">AN OBJECT IN MOTION</p>
        <p class="scroll-hint" id="hint">SCROLL TO DISASSEMBLE</p>
        <div class="progress" aria-hidden="true">
          <span id="progress-fill"></span>
        </div>
        <p class="progress-readout" id="progress-readout">00</p>

        <div class="stage">
          <div class="specimen" id="specimen">
            <img
              class="sheep-img"
              id="sheep"
              src="%BASE_URL%assets/sheep-bare.webp"
              alt="A white sheep, the still center of the composition"
            />
            <div class="ornaments" id="ornaments"></div>
          </div>
        </div>

        <div class="copy" id="copy">
          <p class="line-a" id="line-a">WE DON'T DESIGN OBJECTS.</p>
          <p class="line-b" id="line-b">WE DESIGN <em>WORLDS</em>.</p>
        </div>
      </div>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
