<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fantasy Storybook</title>
    <meta name="theme-color" content="#07060b" />
    <meta
      name="description"
      content="A premium cinematic interactive fantasy storybook. Click a page and enter a completely different world."
    />
    <link rel="icon" href="./textures/leather.png" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <h1 class="sr-only">Interactive fantasy storybook</h1>
    <p class="sr-only">
      The book turns through six illustrated worlds. Click the right page to go
      forward, or the left page to go back.
    </p>

    <div class="studio" data-world="dragon" id="studio">
      <div class="studio-wash"></div>
      <div class="studio-light"></div>
      <div class="studio-floor"></div>

      <div class="realms" aria-hidden="true">
        <div class="realm realm-dragon">
          <div class="smoke smoke-a"></div>
          <div class="smoke smoke-b"></div>
          <div class="smoke smoke-c"></div>
          <div class="ember-haze"></div>
          <svg class="sil sil-dragon d1" viewBox="0 0 200 80" fill="currentColor">
            <path d="M8 50C22 46 34 28 56 32C72 16 98 14 118 32C138 24 164 20 192 12C172 36 144 46 118 48C94 62 60 66 32 60C20 68 10 60 8 50Z"/>
            <path d="M56 32C46 8 72 2 80 26"/>
            <path d="M86 24C80 4 102 0 108 22"/>
          </svg>
          <svg class="sil sil-dragon d2" viewBox="0 0 200 80" fill="currentColor">
            <path d="M8 50C22 46 34 28 56 32C72 16 98 14 118 32C138 24 164 20 192 12C172 36 144 46 118 48C94 62 60 66 32 60C20 68 10 60 8 50Z"/>
            <path d="M56 32C46 8 72 2 80 26"/>
          </svg>
          <svg class="sil sil-dragon d3" viewBox="0 0 200 80" fill="currentColor">
            <path d="M8 50C22 46 34 28 56 32C72 16 98 14 118 32C138 24 164 20 192 12C172 36 144 46 118 48C94 62 60 66 32 60C20 68 10 60 8 50Z"/>
          </svg>
        </div>

        <div class="realm realm-forest">
          <div class="canopy"></div>
          <div class="mist"></div>
          <svg class="branch b1" viewBox="0 0 400 160" fill="none" stroke="currentColor" stroke-width="3">
            <path d="M0 140C40 120 70 40 130 50C170 20 210 70 250 40C290 10 340 50 400 20"/>
            <path d="M130 50C140 10 180 0 190 40"/>
            <path d="M250 40C260 0 300 8 310 36"/>
          </svg>
          <svg class="branch b2" viewBox="0 0 400 160" fill="none" stroke="currentColor" stroke-width="2.4">
            <path d="M400 130C360 110 320 30 260 48C220 18 170 80 120 50C80 24 40 70 0 40"/>
            <path d="M260 48C250 8 210 4 200 42"/>
          </svg>
        </div>

        <div class="realm realm-castle">
          <div class="sun-rays"></div>
          <div class="cloud c1"></div>
          <div class="cloud c2"></div>
          <div class="cloud c3"></div>
          <div class="cloud c4"></div>
          <div class="island i1"></div>
          <div class="island i2"></div>
          <div class="island i3"></div>
          <svg class="sil sil-bird bd1" viewBox="0 0 44 18" fill="currentColor"><path d="M1 11Q12 2 18 11Q24 2 43 9Q26 9 18 14Q10 9 1 11Z"/></svg>
          <svg class="sil sil-bird bd2" viewBox="0 0 44 18" fill="currentColor"><path d="M1 11Q12 2 18 11Q24 2 43 9Q26 9 18 14Q10 9 1 11Z"/></svg>
          <svg class="sil sil-bird bd3" viewBox="0 0 44 18" fill="currentColor"><path d="M1 11Q12 2 18 11Q24 2 43 9Q26 9 18 14Q10 9 1 11Z"/></svg>
          <svg class="sil sil-bird bd4" viewBox="0 0 44 18" fill="currentColor"><path d="M1 11Q12 2 18 11Q24 2 43 9Q26 9 18 14Q10 9 1 11Z"/></svg>
        </div>

        <div class="realm realm-underwater">
          <div class="caustics"></div>
          <div class="water-haze"></div>
          <div class="seaweed sw1"></div>
          <div class="seaweed sw2"></div>
          <div class="seaweed sw3"></div>
          <div class="seaweed sw4"></div>
          <div class="seaweed sw5"></div>
          <div class="fish fi1"></div>
          <div class="fish fi2"></div>
          <div class="fish fi3"></div>
          <div class="fish fi4"></div>
          <div class="jelly j1"></div>
          <div class="jelly j2"></div>
        </div>

        <div class="realm realm-galaxy">
          <div class="nebula n1"></div>
          <div class="nebula n2"></div>
          <div class="nebula n3"></div>
          <div class="planet p1"></div>
          <div class="planet p2 ringed"></div>
          <div class="planet p3"></div>
          <div class="star-field"></div>
        </div>

        <div class="realm realm-garden">
          <div class="garden-haze"></div>
          <div class="bloom bl1"></div>
          <div class="bloom bl2"></div>
          <div class="bloom bl3"></div>
          <div class="bloom bl4"></div>
          <svg class="sil sil-butterfly bf1" viewBox="0 0 48 40">
            <ellipse cx="16" cy="20" rx="12" ry="8" fill="#c9a227" transform="rotate(-18 16 20)"/>
            <ellipse cx="32" cy="20" rx="12" ry="8" fill="#e8d56a" transform="rotate(18 32 20)"/>
            <ellipse cx="24" cy="22" rx="3.2" ry="6" fill="#5a3a12"/>
          </svg>
          <svg class="sil sil-butterfly bf2" viewBox="0 0 48 40">
            <ellipse cx="16" cy="20" rx="12" ry="8" fill="#d4783a" transform="rotate(-18 16 20)"/>
            <ellipse cx="32" cy="20" rx="12" ry="8" fill="#f0b060" transform="rotate(18 32 20)"/>
            <ellipse cx="24" cy="22" rx="3.2" ry="6" fill="#4a2a10"/>
          </svg>
          <svg class="sil sil-butterfly bf3" viewBox="0 0 48 40">
            <ellipse cx="16" cy="20" rx="12" ry="8" fill="#f4e9b0" transform="rotate(-18 16 20)"/>
            <ellipse cx="32" cy="20" rx="12" ry="8" fill="#fff6d0" transform="rotate(18 32 20)"/>
            <ellipse cx="24" cy="22" rx="3.2" ry="6" fill="#6a4a18"/>
          </svg>
        </div>
      </div>

      <canvas class="fx" id="fx" aria-hidden="true"></canvas>

      <div class="stage">
        <div class="book-rig" id="bookRig">
          <div class="book" id="bookShell">
            <div class="cover-board left-board"></div>
            <div class="spread">
              <button class="leaf leaf-left" id="leftLeaf" type="button" aria-label="Turn to previous world"></button>
              <button class="leaf leaf-right" id="rightLeaf" type="button" aria-label="Turn to next world"></button>
              <div class="sheet sheet-left" id="leftSheet"></div>
              <div class="sheet sheet-under" id="underSheet"></div>
              <div class="flipper" id="flipper">
                <div class="face face-front" id="flipFront"></div>
                <div class="face face-back" id="flipBack"></div>
              </div>
              <div class="gutter" aria-hidden="true"></div>
              <div class="stack-right" aria-hidden="true"></div>
              <div class="stack-bottom" aria-hidden="true"></div>
            </div>
            <div class="cover-board right-board"></div>
            <div class="clasp" aria-hidden="true"></div>
          </div>
          <div class="book-shadow" aria-hidden="true"></div>
        </div>
      </div>

      <div class="moments" id="moments" aria-hidden="true"></div>
      <div class="studio-vignette"></div>
      <div class="studio-grain"></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
